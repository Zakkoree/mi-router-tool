<script type="module">
    import './resource/js/app.js';

    const ALLOWED_TABS = ['dashboard', 'apps', 'store', 'system'];
    let currentTab = null;

    function switchTab(tabName) {
        if (currentTab === tabName) return;
        currentTab = tabName;

        const targetBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (targetBtn) targetBtn.classList.add('active');

        if (window.app && typeof window.app.load === 'function') {
            window.app.load(tabName, targetBtn);
        }
    }

    window.navTo = function (tabName) {
        if (window.location.hash.replace('#', '') === tabName) {
            return;
        }
        window.location.hash = tabName;
    };

    function handleRoute() {
        const hash = window.location.hash.replace('#', '').trim();
        const initialTab = ALLOWED_TABS.includes(hash) ? hash : 'dashboard';

        if (!hash || !ALLOWED_TABS.includes(hash)) {
            window.location.replace(`#${initialTab}`);
        }

        switchTab(initialTab);
    }

    app.register('dashboard', '/pages/dashboard.js')
        .register('apps', '/pages/apps.js')
        .register('store', '/pages/store.js')
        .register('system', '/pages/system.js');

    window.addEventListener('hashchange', handleRoute);
    document.addEventListener('DOMContentLoaded', handleRoute);
</script>
