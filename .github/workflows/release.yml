name: Auto Create Release

on:
  push:
    tags:
      - '*.*.*'       # 匹配任意 x.x.x 格式（如 1.0.28）
      - '*.*.*-*'     # 匹配预发布格式（如 1.0.28-rc1）

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update MIKIT_VER in env.sh
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          
          echo "Updating MIKIT_VER to ${VERSION} in mikit/core/env.sh..."
          
          # 检查文件是否存在
          if [ -f "mikit/core/env.sh" ]; then
            # 使用 sed 匹配并替换 MIKIT_VER="xxx" 行
            sed -i "s/^MIKIT_VER=\".*\"/MIKIT_VER=\"${VERSION}\"/" mikit/core/env.sh
          else
            echo "::error::File mikit/core/env.sh not found!"
            exit 1
          fi

      - name: Build Artifacts
        run: |
          mkdir -p dist
          tar -czvf dist/mikit.tar.gz --exclude='.git*' mikit

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          # 如果 tag 中包含 '-' 字符（如 1.0.28-rc1），自动标记为预发布版本 (prerelease)
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: |
            dist/mikit.tar.gz